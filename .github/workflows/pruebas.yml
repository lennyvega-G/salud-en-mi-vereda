name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api:
    name: Pruebas de la API y compilación
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salud_vereda
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/salud_vereda
      JWT_SECRET: secreto-solo-para-pruebas-automaticas
      DATA_KEY: 6b1f3c2e9a8d7f60514233aa9c8e7d6f5b4a39281706f5e4d3c2b1a09f8e7d6c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm run instalar
      - name: Preparar base de datos de prueba
        run: npm run db:init
      - name: Pruebas funcionales (CP01 a CP20)
        run: |
          set -o pipefail
          npm test 2>&1 | tee resultado-pruebas.txt
      - name: Compilar la aplicación web
        run: npm run build --prefix client
      - name: Capturas de pantalla (celular)
        run: |
          set -o pipefail
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          (PORT=3000 npm start > servidor.log 2>&1 &)
          npx --yes wait-on@8 http://localhost:3000/api/salud
          npm run db:init
          node scripts/capturas.mjs 2>&1 | tee capturas-salida.txt
      - name: Accesibilidad y rendimiento (Lighthouse, perfil celular)
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx --yes lighthouse@12.2.1 http://localhost:3000 --form-factor=mobile --screenEmulation.mobile \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html --output-path=capturas/lighthouse \
            --chrome-flags="--headless=new --no-sandbox" --quiet
          node -e "const r=require('./capturas/lighthouse.report.json');const c=r.categories;const a=r.audits;const t=['Lighthouse (celular, red 4G lenta simulada):',...Object.values(c).map(x=>'  '+x.title+': '+Math.round(x.score*100)),'  First Contentful Paint: '+a['first-contentful-paint'].displayValue,'  Largest Contentful Paint: '+a['largest-contentful-paint'].displayValue,'  Peso total: '+a['total-byte-weight'].displayValue].join('\n');console.log(t);require('fs').appendFileSync('capturas/resultados.txt',t+'\n')"
      - name: Escaneo de seguridad (OWASP ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r zap-informe.html -w zap-informe.md -J zap-informe.json -I || true
          cp zap/zap-informe.* capturas/ || true
          node -e "const r=require('./zap/zap-informe.json');const al=r.site.flatMap(s=>s.alerts);const n={'3':0,'2':0,'1':0,'0':0};al.forEach(a=>n[a.riskcode]++);const t=['OWASP ZAP baseline: alto='+n['3']+', medio='+n['2']+', bajo='+n['1']+', informativo='+n['0'],...al.map(a=>'  ['+a.riskdesc+'] '+a.name)].join('\n');console.log(t);require('fs').appendFileSync('capturas/resultados.txt',t+'\n')"
      - name: Resumen de fallas
        if: failure()
        run: |
          for f in resultado-pruebas.txt capturas-salida.txt servidor.log; do
            [ -f "$f" ] || continue
            grep -v '^\s*$' "$f" | tail -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed "s/^/::error title=$f::/"
          done
      - name: Publicar capturas en la rama "capturas"
        if: success() && github.ref == 'refs/heads/main'
        run: |
          cp resultado-pruebas.txt capturas/
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas y resultados de la ejecución ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
