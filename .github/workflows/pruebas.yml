name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Pruebas de la API y compilación
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salud_vereda
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/salud_vereda
      JWT_SECRET: secreto-solo-para-pruebas-automaticas
      DATA_KEY: 6b1f3c2e9a8d7f60514233aa9c8e7d6f5b4a39281706f5e4d3c2b1a09f8e7d6c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm run instalar
      - name: Preparar base de datos de prueba
        run: npm run db:init
      - name: Pruebas funcionales (CP01 a CP20)
        run: |
          set -o pipefail
          npm test 2>&1 | tee resultado-pruebas.txt
      - name: Compilar la aplicación web
        run: npm run build --prefix client
      - name: Capturas de pantalla (celular)
        run: |
          set -o pipefail
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          (PORT=3000 npm start > servidor.log 2>&1 &)
          npx --yes wait-on@8 http://localhost:3000/api/salud
          npm run db:init
          node scripts/capturas.mjs 2>&1 | tee capturas-salida.txt
      - name: Resumen de fallas
        if: failure()
        run: |
          for f in resultado-pruebas.txt capturas-salida.txt servidor.log; do
            [ -f "$f" ] || continue
            grep -v '^\s*$' "$f" | tail -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed "s/^/::error title=$f::/"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
